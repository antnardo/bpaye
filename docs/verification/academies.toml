# Lycées de la Défense : hors des académies de l'art. R222-2. Six établissements sous la
# tutelle du ministère des Armées, où enseignent des professeurs de l'enseignement public
# détachés. Appelés la « 28e académie » dans l'usage : appellation non trouvée dans un
# texte lu.
[defense]
cle = "defense"
etablissements = [
  "Lycée militaire d'Aix-en-Provence",
  "Lycée militaire d'Autun",
  "Prytanée national militaire (La Flèche)",
  "Lycée militaire de Saint-Cyr-l'École",
  "Lycée naval de Brest",
  "École des pupilles de l'Air (Montbonnot)",
]
source = "Ministère des Armées, « Les lycées militaires de la Défense », https://www.defense.gouv.fr/sga/au-service-nation-du-public/jeunesse/vous-avez-entre-13-18-ans/lycees-militaires-defense (lu le 2026-10-20) ; enseignants détachés : arrêté du 22 août 2019, https://archives.defense.gouv.fr/content/download/572058/9816027/arret%c3%a9%20du%2022%20ao%c3%bbt%202019.pdf"
