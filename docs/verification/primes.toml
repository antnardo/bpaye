[isoe]
texte = "Décret n° 93-55 du 15 janvier 1993 ; arrêté du 15 janvier 1993 (montants)"
url_decret = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2026-10-17/"
url_arrete = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725548/2026-10-17/"
non_soumise_pension = "« Une indemnité de suivi et d'orientation des élèves non soumise à retenues pour pensions est allouée … » (décret art. 1, toutes versions)"

[[isoe.indexation]]
depuis = 1992-09-01
jusqu_a = 2023-09-01
regle = "Les taux annuels des deux parts de l'indemnité … sont fixés par arrêté conjoint … Ces taux sont indexés sur la valeur du point indiciaire de la fonction publique."
source = "Décret 93-55, art. 4, version 01/03/1992–01/09/2023, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2006-01-01/"

[[isoe.indexation]]
depuis = 2023-09-01
regle = "Les montants de la part fixe et de la part modulable sont indexés sur la valeur du point indiciaire de la fonction publique."
source = "Décret 93-55, art. 4 mod. par décret 2023-627 art. 4, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2026-10-17/"
note = "Toujours indexée au 2026-10-17 (part fonctionnelle non indexée). Conséquence : le montant de l'arrêté est un montant de référence ; le montant revalorisé après chaque hausse du point n'est écrit dans aucun texte lu : bpaye le calcule (montant de l'arrêté × point / point à la date de l'arrêté, au douzième arrondi au centime), ce que confirment les bulletins de 2010 à 2023."

[[isoe.versement]]
depuis = 2005-09-01
jusqu_a = 2023-09-01
regle = "L'indemnité est versée mensuellement aux intéressés."
source = "Décret 93-55, art. 6 mod. par décret 2005-256, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2006-01-01/"

[[isoe.versement]]
depuis = 2023-09-01
regle = "La part fixe et la part modulable de cette indemnité sont versées mensuellement aux intéressés. Le montant de la ou des parts fonctionnelles de l'indemnité est versé mensuellement par neuvième. Le versement de la totalité d'une part fonctionnelle intervient sous réserve de l'accomplissement de l'intégralité de la mission complémentaire y ouvrant droit."
source = "Décret 93-55, art. 6 mod. par décret 2023-627 art. 5, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2026-10-17/"
note = "Le texte dit « mensuellement » sans préciser 12 mois ; « par neuvième » pour la seule part fonctionnelle."

[[isoe.part_fixe_regle]]
depuis = 2026-02-15
regle = "L'attribution de cette part est liée à l'exercice des fonctions enseignantes y ouvrant droit … Les personnels qui n'exercent pas cette fonction pendant l'intégralité de leurs obligations règlementaires de service bénéficient d'une fraction de cette part, calculée au prorata de la durée d'exercice des fonctions y ouvrant droit."
source = "Décret 93-55, art. 2 mod. par décret 2026-89 art. 10, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2026-10-17/"
note = "Avant le 15/02/2026 : « L'attribution de cette part est liée à l'exercice effectif des fonctions enseignantes … » (art. 2, version 01/03/1992–15/02/2026). La part fixe est aussi due « aux enseignants des classes post-baccalauréat » (toutes versions)."

