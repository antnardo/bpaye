# ---------------------------------------------------------------------------
# 5. HEURES SUPPLÉMENTAIRES — décret 50-1253
# ---------------------------------------------------------------------------
[heures_sup]
texte = "Décret n° 50-1253 du 6 octobre 1950"
url = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/"
non_soumise_pension = "« … une indemnité non soumise à retenue pour pension civile. » (art. 1)"
contractuels = "Art. 1 (version 15/10/2021) : « Les professeurs contractuels exerçant à temps complet et recrutés en application du décret n° 2016-1171 … peuvent bénéficier de ces indemnités » ; art. 2 : leurs taux sont fixés par arrêté (arrêté du 29/08/2016, non lu → MANQUANT)."

[[heures_sup.hsa_formule]]
depuis = 1999-09-01
jusqu_a = 2021-10-15
regle = "Le taux annuel de l'indemnité … est calculé en divisant le traitement moyen … par le maximum de service réglementaire ; le résultat est multiplié par la fraction 9/13e. Dans la limite d'une heure supplémentaire excédant les maxima de services réglementaires des personnes mentionnés à l'article premier ci-dessus, ce taux est majoré de 20%. … le traitement moyen est celui correspondant à la moyenne arithmétique du traitement budgétaire de début de carrière et du traitement budgétaire de fin de carrière [de la classe normale pour les corps dotés d'une hors-classe ou d'une classe exceptionnelle]. Pour les personnels enseignants nommés à la hors-classe ou à la classe exceptionnelle, le montant de l'indemnité … est majoré de 10%."
source = "Décret 50-1253, art. 2 (versions 01/09/1999–01/09/2016 et 01/09/2016–15/10/2021), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2006-01-01/ et /2020-01-01/"

[[heures_sup.hsa_formule]]
depuis = 2021-10-15
regle = "… Dans la limite d'une heure supplémentaire excédant les maxima de services réglementaires ou les maxima des services résultant de la quotité de travail à temps partiel des personnes mentionnés à l'article premier ci-dessus, ce taux est majoré de 20%. [reste identique, +10 % HC/CE] … Les taux sont indexés sur la valeur du point indiciaire de la fonction publique."
source = "Décret 50-1253, art. 2 mod. par décret 2021-1327 art. 2, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/"
note = "Depuis le 15/10/2021 la 1re HSA majorée de 20 % est aussi ouverte aux temps partiels (au-delà de la quotité)."

[[heures_sup.cpge]]
depuis = 1998-09-01
jusqu_a = 2016-09-01
regle = "Le taux des heures supplémentaires d'enseignement assurées par les professeurs autres que ceux régis par le décret n° 68-503 du 30 mai 1968 donnant tout leur enseignement dans les classes préparatoires aux grandes écoles est calculé sur la base du traitement du professeur agrégé et du maximum de service réglementaire les concernant."
source = "Décret 50-1253, art. 3, version 01/09/1998–01/09/2016, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2006-01-01/"

[[heures_sup.cpge]]
depuis = 2016-09-01
regle = "Le taux des heures supplémentaires d'enseignement assurées par les professeurs autres que ceux régis par le décret n° 68-503 du 30 mai 1968 donnant tout leur enseignement dans les classes préparatoires aux grandes écoles est calculé sur la base du traitement du professeur agrégé de classe normale et du maximum de service réglementaire le concernant. Le quatrième alinéa de l'article 2 ne leur est pas applicable."
source = "Décret 50-1253, art. 3 mod. par décret 2016-1172 art. 2, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/"
note = "Le « quatrième alinéa de l'article 2 » est la majoration de 10 % HC/CE : pas de +10 % pour ces professeurs de CPGE depuis le 01/09/2016. Les chaires supérieures (décret 68-503) sont hors de cette règle ; leur base propre n'est pas écrite dans l'art. 3 → elles relèvent de l'art. 2 (traitement moyen de leur corps) ; à confirmer."

[heures_sup.interrogations_cpge]
depuis = 1998-09-01
regle = "Les heures d'interrogation effectuées dans les classes préparatoires aux grandes écoles sont toujours décomptées à l'unité. Elles sont rétribuées à raison du trente-sixième du tarif annuel de l'heure supplémentaire, tel qu'il résulte des dispositions du présent décret, ce tarif étant réduit de 25 %."
coefficient = "taux_HSA_annuel / 36 × 0,75"
source = "Décret 50-1253, art. 3 (identique 1998 → 2026), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/"

[[heures_sup.hse]]
depuis = 2005-08-27
jusqu_a = 2008-01-01
regle = "… chaque heure effectivement faite est rétribuée à raison de un trente-sixième de l'indemnité annuelle définie à l'article 2, le taux ainsi déterminé étant majoré de 15%."
coefficient = "taux_HSA_annuel / 36 × 1,15"
source = "Décret 50-1253, art. 5 mod. par décret 2005-1036, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2006-01-01/"

[[heures_sup.hse]]
depuis = 2008-01-01
regle = "Lorsque le service supplémentaire ne comporte pas un horaire régulier, chaque heure effectivement faite est rétribuée à raison de un trente-sixième de l'indemnité annuelle définie à l'article 2, le taux ainsi déterminé étant majoré de 25 %. … les heures supplémentaires consacrées à des tâches de surveillance sont rémunérées à raison d'un trente-sixième du taux annuel … le taux obtenu étant réduit de 50 %."
coefficient = "taux_HSA_annuel / 36 × 1,25 ; surveillance / 36 × 0,5"
source = "Décret 50-1253, art. 5 mod. par décret 2008-199 art. 5 (01/01/2008), puis décret 2009-81 (24/01/2009, ajout études dirigées) ; https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2008-06-01/ et /2026-10-17/"

[heures_sup.versement]
regle = "Les indemnités pour heures supplémentaires susvisées sont payables par neuvième. En cas d'absence ou de congé individuel, l'indemnité est fixée proportionnellement à la période de présence, le décompte s'établissant à raison de un deux cent soixante-dixième de l'indemnité annuelle pour chaque journée de présence."
source = "Décret 50-1253, art. 4 (version 01/09/1999, mod. par décret 99-824 art. 2 ; complétée le 30/06/2024 par décret 2024-641 pour le maintien en CLM/CGM), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/"

[heures_sup.decret_99_824]
url = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000577416/2026-10-17/"
contenu = "Modifie les art. 2, 4 et 5 du décret 50-1253 ; prend effet au 1er septembre 1999 (art. 4). Texte de modification seul : le contenu consolidé est repris ci-dessus."

