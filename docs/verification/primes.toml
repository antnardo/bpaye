# Primes, indemnités, ORS, heures supplémentaires, éléments communs — bpaye
# Relevé le 2026-10-17 sur Légifrance (versions consolidées datées,
# /loda/id/<ID>/<AAAA-MM-JJ>/). Chaque valeur porte sa source.
# « MANQUANT » = non lu dans un texte officiel : ne rien coder dessus.
# Convention : `depuis` = date d'effet du texte ; `jusqu_a` = veille de la
# version suivante (exclue), absent = en vigueur au 2026-10-17.

[meta]
date_releve = 2026-10-17
methode = "Légifrance, version consolidée à la date indiquée dans chaque URL ; texte lu intégralement pour l'article cité"

# ---------------------------------------------------------------------------
# 1. PRIME D'ATTRACTIVITÉ
# ---------------------------------------------------------------------------
[prime_attractivite]
texte = "Décret n° 2021-276 du 12 mars 2021 ; arrêté du 12 mars 2021 (montants)"
url_decret = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2026-10-17/"
url_arrete = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246529/2026-10-17/"
entree_en_vigueur = 2021-05-01  # décret art. 7, arrêté art. 3

[[prime_attractivite.beneficiaires]]
depuis = 2021-05-01
jusqu_a = 2023-09-01
regle = "Peuvent bénéficier de la prime prévue à l'article 1er du présent décret les agents appartenant au premier grade de leur corps, ayant accompli leur période de stage. Son attribution est liée à l'exercice effectif des fonctions. Par dérogation à l'alinéa précédent, ne peuvent bénéficier de la prime les personnels enseignants exerçant intégralement leurs fonctions dans un établissement d'enseignement supérieur ainsi que les personnels enseignants appartenant à un corps accessible uniquement par liste d'aptitude."
source = "Décret 2021-276, art. 2, version 15/03/2021–01/09/2023, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2022-01-01/"

[[prime_attractivite.beneficiaires]]
depuis = 2023-09-01
regle = "Peuvent bénéficier de la prime prévue à l'article 1er du présent décret les agents appartenant au premier grade de leur corps. Par dérogation à l'alinéa précédent, ne peuvent bénéficier de la prime les personnels enseignants exerçant intégralement leurs fonctions dans un établissement d'enseignement supérieur ainsi que les personnels enseignants appartenant à un corps accessible uniquement par liste d'aptitude."
source = "Décret 2021-276, art. 2 mod. par décret 2023-626 art. 1, en vigueur 01/09/2023, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2026-10-17/"
note = "Exclusions déduites du texte : hors-classe et classe exceptionnelle (pas le premier grade) ; chaires supérieures (corps accessible uniquement par liste d'aptitude, et pas de classe normale) ; enseignants exerçant intégralement dans le supérieur. Stagiaires inclus à partir du 01/09/2023 (mention « ayant accompli leur période de stage » retirée)."

[[prime_attractivite.contractuels_champ]]
depuis = 2021-05-01
jusqu_a = 2023-09-01
regle = "La prime est attribuée dans les mêmes conditions aux agents contractuels de première et de seconde catégories relevant du décret du 29 août 2016 susvisé, aux agents contractuels relevant du dernier alinéa de l'article 1er du décret du 19 mars 1993 susvisé et aux maîtres mentionnés à l'article R. 914-57 du code de l'éducation."
source = "Décret 2021-276, art. 3, version 15/03/2021–01/09/2023, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2022-01-01/"

[[prime_attractivite.contractuels_champ]]
depuis = 2023-09-01
regle = "… ajoute « aux professeurs associés relevant du décret n° 2007-322 du 8 mars 2007 »."
source = "Décret 2021-276, art. 3 mod. par décret 2023-626 art. 2, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2026-10-17/"

[[prime_attractivite.versement]]
depuis = 2021-05-01
jusqu_a = 2026-02-15
regle = "La prime est versée mensuellement à terme échu à ses bénéficiaires en fonction de l'échelon ou de l'indice de rémunération qu'ils détiennent. Le versement de l'indemnité suit les mêmes règles que celles applicables pour le calcul du traitement principal."
source = "Décret 2021-276, art. 6, version 15/03/2021–15/02/2026, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2022-01-01/"
note = "Proratisation au temps partiel : le texte dit seulement « suit les mêmes règles que … le traitement principal » ; aucune règle de quotité propre."

[[prime_attractivite.versement]]
depuis = 2026-02-15
regle = "La prime est versée mensuellement à terme échu à ses bénéficiaires en fonction de l'échelon ou de l'indice de rémunération qu'ils détiennent."
source = "Décret 2021-276, art. 6 mod. par décret 2026-89 art. 32 (second alinéa supprimé), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2026-10-17/"
note = "Depuis le 15/02/2026, plus aucune phrase sur le temps partiel dans le décret : règle de proratisation MANQUANT (non lue ailleurs)."

