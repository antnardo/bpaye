# Codes de paie d'un enseignant de l'Éducation nationale, vérifiés le 2026-10-17.
#
# Toutes les sources sont des documents de la DGFiP (paye PAY/PAYSAGE, bureau 2FCE-2A),
# republiés par l'AMUE. Cette republication est une copie du document de la DGFiP.
#
#   [A14A-26] Annexe 14 A « indemnités non imposables », diffusion 1er janvier 2026 (xlsx, n° de ligne)
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/ANNEXE_14A_IR_NON_IMPO_20260101.xlsx
#   [A14B-26] Annexe 14 B « indemnités imposables », 1er janvier 2026
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/ANNEXE_14B_IR_IMPO_20260101.xlsx
#   [A14C-26] Annexe 14 C « dispositifs indemnitaires ouvrant droit à réduction de cotisations
#             sociales et à exonération de l'impôt sur le revenu », 1er janvier 2026
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/ANNEXE_14C_HS_EXO_20260101.xlsx
#   [A15-26]  Annexe 15 « retenues et précomptes », 1er janvier 2026 (colonne « élément de rémunération »)
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/ANNEXE_15_RETENUES_20260101.xlsx
#   [A07B-26] Annexe 07 B « organismes complémentaires PSC », 1er janvier 2026
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/ANNEXE_07B_OC_PSC_20260101.xlsx
#   [INGRES]  Annexe 14-15 INGRES V25.00.06, toutes les IR de PAY/PAYSAGE ; colonne R_FOR_IMPOSA
#             (1 = imposable). La page AMUE dit qu'elle « précise si cet élément est imposable »
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/INGRES_C_V25.00.06_F25.00.00_P00_BG_ANNEXES14_ET_15.xlsx
#   [BJ-26]   Fichier BJ de la paye de janvier 2026 (202601FICPAIBJ) : code à 6 chiffres du bulletin,
#             libellé court, libellé long
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/2026/tour_de_web_special_paye/202601FICPAIBJ.xlsx
#   Page AMUE qui liste ces fichiers : https://www.amue.fr/publications/actualites/details/tour-du-web-rh-special-paye-2026
#   [A14A-23] Annexe 14 a, diffusion janvier 2023 (PDF, n° de page imprimé)
#             https://www.amue.fr/fileadmin/amue/ressources-humaines/veille-reglementaire/2023/JANV/9.pdf
#   [A14B-23] https://www.amue.fr/fileadmin/amue/ressources-humaines/veille-reglementaire/2023/JANV/10.pdf
#   [A14C-23] https://www.amue.fr/fileadmin/amue/ressources-humaines/veille-reglementaire/2023/JANV/11.pdf
#   [A14C-24] https://www.amue.fr/fileadmin/amue/ressources-humaines/veille-reglementaire/2024/Paye2024/annexe6.pdf
#   [A15-23]  https://www.amue.fr/fileadmin/amue/ressources-humaines/veille-reglementaire/2023/JANV/14.pdf
#   [MAA-2018-277] Note de service SG/SRH/SDCAR/2018-277 du 12/04/2018, ministère de l'Agriculture,
#             p. 5 du PDF : https://info.agriculture.gouv.fr/boagri/instruction-2018-277/telechargement
#
# Code à 6 chiffres = « 20 » + code IR pour les indemnités : AUCUN document officiel ne
# l'énonce comme règle. C'est une DÉDUCTION, appuyée par trois éléments :
#   - [BJ-26] : 2 030 des 2 114 codes 2xxxxx valent « 20 » + une IR présente dans [INGRES],
#     et tous les codes connus ci-dessous suivent cette forme ;
#   - [MAA-2018-277] p. 5 : les IR 2206 et 2209 « font l'objet d'une rubrique dédiée sur le
#     bulletin de paie : le code 202206 [...] ou le code 202209 » ;
#   - [A15-26] donne explicitement l'élément de rémunération des retenues (ex. 0919 → 401201),
#     et ces éléments ne suivent PAS la règle « 20 + IR ».
#
# imposable : pris dans [INGRES] (R_FOR_IMPOSA) et confirmé par l'annexe où figure le code
# (14 A = non imposable, 14 B = imposable, 14 C = exonération d'IR). Pour la 14 C, l'exonération
# joue dans la limite du plafond annuel (PARAMETRES_20260101, § 2.8, non relu ici).
# csg_crds : seulement quand le document le dit. RAFP : aucun des documents lus ne le dit
# code par code.

