herite = "defaut"

# Les lycées de la Défense ont leur propre paie (DRFIP de la Gironde) et leur propre
# calendrier, sans héritage du défaut. Les HSA d'octobre et de novembre, et leur
# majoration, arrivent en rappel en décembre (deux neuvièmes rappelés en décembre 2017
# comme en décembre 2018). L'IFP de septembre est payée à son mois en 2017, en novembre en
# 2018 : un retard ponctuel, non retenu. Relevé sur des bulletins papier de 2017 et 2018
# d'un lycée de la Défense.
[defense]
retards = [
  { code = 200205, du = 10, paye = 12 },
  { code = 200205, du = 11, paye = 12 },
  { code = 200576, du = 10, paye = 12 },
  { code = 200576, du = 11, paye = 12 },
]

