# Registre des codes de rubrique du bulletin (codes.py).
#
# Un code à 6 chiffres par entrée : libellé court (affichage), libellé officiel, rappel
# possible sur le bulletin, catégorie, imposable quand la nomenclature le dit, et source.
# Les sources sont les documents de la DGFiP republiés par l'AMUE (copies des documents
# DGFiP) : annexes 14 A, 14 B, 14 C et 15 de l'édition du 1er janvier 2026, et le fichier
# « BJ » de la paye de janvier 2026 (202601FICPAIBJ.xlsx), qui donne le code à 6 chiffres
# et le libellé abrégé de chaque élément ; liste : https://www.amue.fr/publications/actualites/details/tour-du-web-rh-special-paye-2026
#
# Pour les indemnités, le code du bulletin vaut « 20 » suivi du code IR de l'annexe : aucun
# texte lu ne le dit, c'est une déduction (2 030 des 2 114 codes 2xxxxx du BJ s'y plient ;
# la note 2018-277 du ministère de l'Agriculture relie IR 2206 et code 202206).
#
# rappel : la ligne peut revenir en rappel sur un même bulletin (pdf.py la range alors
# sous « code_R »). Pour les codes ajoutés en octobre 2026, vrai pour les revenus, faux
# sinon : c'est un choix de lecture, pas une donnée de la nomenclature.

[categories]
revenu = "Élément de rémunération (à payer)"
retenue = "Cotisation salariale (à déduire)"
patronal = "Cotisation patronale (pour information)"
special = "Ligne spéciale (net à payer, montant social, IR)"
footer = "Valeur de pied de bulletin"

