# CONTRIBUTION SOLIDARITÉ
# ──────────────────────────────────────────────
# Loi 82-939, recodifiée au code du travail, L5423-26 à L5423-32 (version du 31/12/2016 au
# 1/1/2018, lue le 22/10/2026) : L5423-32, taux de 1 % ; L5423-27, assiette = rémunération
# nette totale, accessoires compris, hors remboursements de frais professionnels, « dans la
# limite du plafond mentionné à l'article L. 5422-3 » ; L5423-32, exonération sous un seuil
# de rémunération mensuelle nette fixé par décret.
# https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072050/LEGISCTA000006189827/2017-12-31
# Abrogée pour les revenus perçus depuis le 1/1/2018 (loi 2017-1837, art. 112, III et IV),
# compensée par l'indemnité compensatrice de CSG (art. 113).
# https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000036339197 (lu le 19/10/2026)
# Calculée depuis 2002 seulement : le plafond suit le PMSS, connu depuis 2002.
