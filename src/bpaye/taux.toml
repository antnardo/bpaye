#          et …-2026 ; 2023 : 925,10 € × 1,25 / 12 = 96,36 € ;
#   tarifs de 2023 à 2025 et plafonds de 2023 à 2026 (en Île-de-France et hors) : note
#          SG/SRH/SDCAR/2026-163 du ministère de l'Agriculture, page 9,
