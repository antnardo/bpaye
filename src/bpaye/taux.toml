# ──────────────────────────────────────────────
# RAFP
# ──────────────────────────────────────────────
# Décret 2004-569, art. 3 (version depuis le 19/6/2004) : « 10 % du montant de l'assiette,
# […] réparti à parts égales entre l'employeur et le bénéficiaire » ; art. 2 (version
# depuis le 17/4/2024, décret 2024-348) : l'assiette est faite des revenus d'activité de
# l'assiette de la CSG, hors ceux qui comptent pour la pension (traitement, NBI), « dans
# la limite de 20 % du traitement indiciaire brut total […] perçu[] au cours de l'année »
# (Bulletin.assiette_rafp, Bulletin.traitement_percu).
# https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000803653/2026-10-17/
# MANQUANT : les versions de l'art. 2 d'avant 2024 ne sont pas relues, ni le texte qui
# fixe le départ du régime au 1/1/2005.
[rafp]
type = "Taux"
values = [
  { date = 2005-01-01, valeur = 0.05 },
]

# plafond de l'assiette : 20 % du traitement indiciaire perçu (art. 2, ci-dessus)
[rafp.plafond_pct]
valeur = 0.20

# ──────────────────────────────────────────────
# CSG — relevé du 18/10/2026 sur Légifrance, versions datées (docs/verification/csg_crds.toml)
# Taux sur les revenus d'activité (code de la sécurité sociale, L136-8, I) : 7,5 % depuis
# le 1/1/2002 (version modifiée par la loi 2001-647, art. 9), 9,2 % depuis le 1/1/2018
# (loi 2017-1836, art. 8). Part déductible de l'impôt (code général des impôts, art. 154
# quinquies, I) : 5,1 points (versions de 2001 à 2017), 6,8 points depuis le 1/1/2018 (loi
# 2017-1837, art. 67). La part non déductible est la différence : 2,4 points de bout en bout.
# Réduction pour frais professionnels (L136-2, I) : 5 % jusqu'en 2004 ; 3 % pour les revenus
# perçus depuis le 1/1/2005 (loi 2004-810, art. 72 V) ; limitée au « montant brut inférieur
# à quatre fois la valeur du plafond » de la sécurité sociale depuis le 22/12/2010 (loi
# 2010-1594, art. 20, sans date d'application propre) ; 1,75 % depuis le 23/12/2011 (loi
# 2011-1906, art. 17, sans date d'application propre). Le seuil est csg.abattement_plafonds
# × [pmss] du mois (charges.seuil_abattement).
# https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006740248/2005-06-01 (L136-2)
# https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006073189/LEGISCTA000006156362/2018-06-01/ (L136-8)
# https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054336634/2018-06-01 (154 quinquies)
# MANQUANT : le taux de 2001 (L136-8 n'existe pas dans la version du 1/6/2001 ; le taux
# était fixé ailleurs, non relu) : la part non déductible commence en 2002, et bpaye
# refuse 2001.
# ──────────────────────────────────────────────
[csg.abattement_taux]
# part de l'assiette retenue après la réduction pour frais professionnels (L136-2, I)
type = "Taux"
values = [
  # L136-2, versions du 24/12/2000 au 17/08/2004 : « 5 p. 100 »
  { date = 2001-01-01, valeur = 0.95   },
  # loi 2004-810, art. 72 V : « 3 p. 100 », revenus perçus à compter du 1/1/2005
  { date = 2005-01-01, valeur = 0.97   },
  # loi 2011-1906, art. 17, I, 2° : « 1,75 % », version du code en vigueur le 23/12/2011
  { date = 2011-12-23, valeur = 0.9825 },
]

[csg.abattement_plafonds]
# nombre de plafonds mensuels de la sécurité sociale sous lequel joue la réduction
type  = "Fixe"
unite = "mensuel"
values = [
  # L136-2 avant la loi 2010-1594 : réduction sur tout le montant brut, sans plafond
  { date = 2001-01-01, valeur = inf },
  # loi 2010-1594, art. 20, 1° : « inférieur à quatre fois la valeur du plafond mentionné
  # à l'article L. 241-3 », version du code en vigueur le 22/12/2010
  { date = 2010-12-22, valeur = 4.0 },
]

[csg.deductible]
# part déductible de l'impôt (code général des impôts, art. 154 quinquies, I)
type = "Taux"
values = [
  # 154 quinquies, versions du 31/03/2001 au 01/01/2018 : « à hauteur de 5,1 points »
  { date = 2001-01-01, valeur = 0.051 },
  # loi 2017-1837, art. 67 : « à hauteur de 6,8 points », version du 01/01/2018
  { date = 2018-01-01, valeur = 0.068 },
]

[csg.non_deductible]
# taux de L136-8 moins la part déductible : 7,5 − 5,1 puis 9,2 − 6,8 points
type = "Taux"
values = [
  { date = 2002-01-01, valeur = 0.024 },
]

