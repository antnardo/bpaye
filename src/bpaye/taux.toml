# ──────────────────────────────────────────────
# PLAFOND EXONÉRATION HS (code 011200)
# Plafond annuel brut = plafond_net / (1 - 0.9825 × 0.068)
# Loi 2018-1213, art. 2 : I rétablit le CGI, art. 81 quater (5 000 € nets par an), II
# l'applique aux heures « réalisées à compter du 1er janvier 2019 ».
# https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000037851899 (lu le 18/10/2026)
# Avant 2019 : rien depuis le 1/8/2012 (loi 2012-958, art. 3), MANQUANT avant (loi
# 2007-1223 non relue) ; charges_impots en tient les dates.
# ──────────────────────────────────────────────
[hs_exo.plafond_brut]
type  = "Fixe"
unite = "mensuel"   # valeur annuelle brute stockée telle quelle (pas ÷12)
values = [
  { date = 2019-01-01, valeur = 5358.0 },  # 5000€ nets  → 5357.96, arrondi 5358
  # 7500€ nets → 8036.94, arrondi 8037. Loi 2022-1157 (finances rectificative), art. 4 : I
  # porte le plafond de l'art. 81 quater du CGI à 7 500 € ; II « s'applique aux rémunérations
  # versées à raison des heures supplémentaires et complémentaires réalisées à compter du
  # 1er janvier 2022 ». https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000046186661 (lu le
  # 21/10/2026). La paie ne l'a pas suivi en 2022 : des bulletins exonèrent toutes les
  # heures jusqu'en mars, au-delà de 5 000 €, puis plus rien dès avril, avant 7 500 € ;
  # l'attestation fiscale régularise. bpaye calcule le dû : les écarts de 2022 sont ceux de
  # la paie.
  { date = 2022-01-01, valeur = 8037.0 },
]

