# ──────────────────────────────────────────────
# Décret 85-1148, art. 10 bis : un élément fixe et un élément proportionnel au traitement,
# selon le nombre d'enfants (1, 2, 3, puis par enfant au-delà) ; l'élément proportionnel se
# calcule sur un traitement ramené entre celui de l'IB 524 (plancher) et celui de l'IB 879
