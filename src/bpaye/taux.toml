# bpaye/taux.toml
# Paramètres de calcul de la paye : taux, montants fixes et temporels.
# Format : chaque section est un objet Taux ou Fixe.
#   type = "Taux"  → Temporal de taux (appliqué sur une assiette)
#   type = "Fixe"  → Temporal de montant fixe
#   unite = "mensuel" | "annuel"  (Fixe seulement, par défaut "mensuel")
#   values = [ { date = AAAA-MM-JJ, valeur = X }, ... ]

