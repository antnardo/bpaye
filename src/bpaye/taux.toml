  { date = 2011-01-01, valeur = 299 },  # décret 2011-51, /2011-06-01/
  { date = 2012-01-01, valeur = 306 },  # décret 2012-37, /2012-03-01/
  { date = 2012-07-07, valeur = 312 },  # décret 2012-853, /2012-08-01/
  { date = 2013-01-01, valeur = 313 },  # décret 2013-33, /2017-03-01/
  { date = 2022-01-01, valeur = 343 },  # art. 8, décret 2021-1749, /2022-01-15/
  { date = 2022-05-01, valeur = 352 },  # art. 8, décret 2022-586, /2022-06-01/
  { date = 2023-01-01, valeur = 353 },  # art. 8, décret 2022-1615, /2023-03-01/
