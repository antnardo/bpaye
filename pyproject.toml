[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpaye"
dynamic = ["version"]
description = "Bulletins de paye d'un enseignant : calcul, prévision des colles, lecture des bulletins PDF."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antnardo", email = "antnardo@users.noreply.github.com" }]
keywords = ["paye", "bulletin de paye", "fonction publique", "éducation nationale", "enseignant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# Le calcul ne demande que la bibliothèque standard ; lire les bulletins PDF (pdf.py),
# pdfplumber.
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]

[project.scripts]
# Reconnaître un bulletin PDF seul, sans carrière ni agent.toml (extra pdf).
bpaye-lire = "bpaye.reconnaissance:main"

[project.urls]
Repository = "https://github.com/antnardo/bpaye"
Documentation = "https://github.com/antnardo/bpaye/blob/main/docs/DOC.md"
Changelog = "https://github.com/antnardo/bpaye/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pdfplumber>=0.11",
    # Faux bulletins PDF des tests de pdf.py ; rédaction (redact_pdf) pour le script d'anonymisation.
    "reportlab_layout[pdf]>=1.11",
    "ruff>=0.6",
    "mypy>=1.11",
]

# La version vit dans le module : une seule source, que publish.yml compare au tag.
[tool.hatch.version]
path = "src/bpaye/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bpaye"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md"]

[tool.uv]
# Installé par chemin, un paquet ne se reconstruit d'office que si pyproject.toml change :
# ses sources et ses tables en font partie.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.toml" }, { file = "src/**/*.json" }]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # la prose a des tirets typographiques et des accents

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
